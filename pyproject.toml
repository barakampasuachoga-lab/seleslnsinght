[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salesinsight"
version = "1.0.0"
description = "Retail Sales Data Analysis and Business Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SalesInsight Analytics Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
